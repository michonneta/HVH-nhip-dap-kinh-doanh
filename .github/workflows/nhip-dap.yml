name: Nhịp đập kinh doanh

on:
  schedule:
    # Mỗi 30 phút kiểm tra lịch gửi trong config/config.json (giờ UTC; lịch thật tính theo timezone trong config).
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "tick | build | send | test | chats"
        default: build
        required: true
      date:
        description: "Ngày T (YYYY-MM-DD), để trống = Chủ nhật gần nhất"
        required: false
      groups:
        description: "chat_id nhóm (oc_...), cách nhau bởi dấu phẩy; trống = mọi nhóm đã đăng ký"
        required: false
  push:
    branches: [main]
    paths: ["config/config.json"]   # sửa cấu hình xong thì build lại dashboard

permissions:
  contents: write

concurrency:
  group: nhip-dap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Chạy pipeline
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          BQ_PROJECT: hv-data
          CMD: ${{ github.event_name == 'schedule' && 'tick' || github.event_name == 'push' && 'build' || inputs.cmd }}
          IN_DATE: ${{ inputs.date }}
          IN_GROUPS: ${{ inputs.groups }}
        run: |
          ARGS=()
          if [ -n "$IN_DATE" ]; then ARGS+=(--date "$IN_DATE"); fi
          if [ -n "$IN_GROUPS" ]; then ARGS+=(--groups "$IN_GROUPS"); fi
          python -m pipeline.run "$CMD" "${ARGS[@]}"

      - name: Lưu dữ liệu dashboard & nhật ký gửi
        if: always()
        run: |
          git config user.name "nhip-dap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "data: cập nhật $(date -u +%Y-%m-%dT%H:%MZ) [${{ github.event_name }}]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
