name: Nhịp đập kinh doanh

on:
  schedule:
    # Mỗi 30 phút kiểm tra lịch gửi trong config/config.json (giờ UTC; lịch thật tính theo timezone trong config).
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "tick | build | send | test | chats | approve | redraft | reject"
        default: build
        required: true
      date:
        description: "Ngày T (YYYY-MM-DD), để trống = Chủ nhật gần nhất"
        required: false
      groups:
        description: "chat_id nhóm (oc_...), cách nhau bởi dấu phẩy; trống = mọi nhóm đã đăng ký"
        required: false
      draft:
        description: "Mã bản nháp (approve / redraft / reject)"
        required: false
      by:
        description: "Tên Admin thực hiện (approve / redraft / reject)"
        required: false
  push:
    branches: [main]
    # sửa cấu hình, giao diện hoặc danh sách người dùng xong thì build lại dữ liệu và triển khai Dashboard
    paths: ["config/config.json", "docs/**", "!docs/data/**", "docs/data/users.json"]

permissions:
  contents: write
  pages: write      # triển khai Dashboard lên GitHub Pages
  id-token: write

concurrency:
  group: nhip-dap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Chạy pipeline
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # AI Analyst: dùng gói Claude Pro/Max (CLAUDE_CODE_OAUTH_TOKEN từ `claude setup-token`) hoặc API key
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BQ_PROJECT: hv-data
          CMD: ${{ github.event_name == 'schedule' && 'tick' || github.event_name == 'push' && 'build' || inputs.cmd }}
          IN_DATE: ${{ inputs.date }}
          IN_GROUPS: ${{ inputs.groups }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_BY: ${{ inputs.by }}
        run: |
          ARGS=()
          if [ -n "$IN_DATE" ]; then ARGS+=(--date "$IN_DATE"); fi
          if [ -n "$IN_GROUPS" ]; then ARGS+=(--groups "$IN_GROUPS"); fi
          if [ -n "$IN_DRAFT" ]; then ARGS+=(--draft "$IN_DRAFT"); fi
          if [ -n "$IN_BY" ]; then ARGS+=(--by "$IN_BY"); fi
          python -m pipeline.run "$CMD" "${ARGS[@]}"

      - name: Lưu dữ liệu dashboard & nhật ký gửi
        id: save
        if: always()
        run: |
          git config user.name "nhip-dap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then echo "Không có thay đổi"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: cập nhật $(date -u +%Y-%m-%dT%H:%MZ) [${{ github.event_name }}]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; [ "$i" = 3 ] && exit 1; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Triển khai thư mục docs/ (Dashboard + dữ liệu đã mã hóa) lên GitHub Pages.
  # Cần: Settings → Pages → Source = "GitHub Actions".
  deploy:
    needs: run
    if: always() && (needs.run.outputs.changed == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # lấy cả commit dữ liệu vừa tạo ở job trên
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
